apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: l8ai-mail-data
  labels:
    app.kubernetes.io/name: doemail
    app.kubernetes.io/component: mail-runtime
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: l8ai-mail-state
  labels:
    app.kubernetes.io/name: doemail
    app.kubernetes.io/component: mail-runtime
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: l8ai-mail-config
  labels:
    app.kubernetes.io/name: doemail
    app.kubernetes.io/component: mail-runtime
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
