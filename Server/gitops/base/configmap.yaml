apiVersion: v1
kind: ConfigMap
metadata:
  name: l8ai-mail-config
  labels:
    app.kubernetes.io/name: doemail
    app.kubernetes.io/component: mail-runtime
data:
  OVERRIDE_HOSTNAME: mail.l8ai.cn
  POSTMASTER_ADDRESS: postmaster@l8ai.cn
  ENABLE_OPENDKIM: "0"
  ENABLE_OPENDMARC: "0"
  ENABLE_POP3: "0"
  ENABLE_CLAMAV: "0"
  ENABLE_SPAMASSASSIN: "0"
  ONE_DIR: "1"
  PERMIT_DOCKER: network
  SSL_TYPE: self-signed
