apiVersion: v1
kind: Service
metadata:
  name: l8ai-mail
  labels:
    app.kubernetes.io/name: doemail
    app.kubernetes.io/component: mail-runtime
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: doemail
    app.kubernetes.io/component: mail-runtime
  ports:
    - name: smtp
      port: 25
      targetPort: smtp
      protocol: TCP
    - name: submission
      port: 587
      targetPort: submission
      protocol: TCP
    - name: imaps
      port: 993
      targetPort: imaps
      protocol: TCP
