apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: l8ai-mail-data
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: zhiyong-local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: l8ai-mail-state
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: zhiyong-local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: l8ai-mail-config
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: zhiyong-local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: l8ai-mail
spec:
  type: ClusterIP
  externalIPs: [89.250.81.243]
  selector:
    app.kubernetes.io/name: l8ai-mail
  ports:
    - name: smtp
      port: 25
      targetPort: smtp
    - name: submission
      port: 587
      targetPort: submission
    - name: smtps
      port: 465
      targetPort: smtps
    - name: imaps
      port: 993
      targetPort: imaps
---
apiVersion: v1
kind: Service
metadata:
  name: l8ai-mail-internal
  labels:
    app.kubernetes.io/name: l8ai-mail-internal
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: l8ai-mail
  ports:
    - name: relay
      port: 25
      targetPort: 2525
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: l8ai-mail-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: l8ai-mail
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: oilan-ai-mail
      ports:
        - protocol: TCP
          port: 2525
    - ports:
        - protocol: TCP
          port: 25
        - protocol: TCP
          port: 587
        - protocol: TCP
          port: 465
        - protocol: TCP
          port: 993
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: l8ai-mail-runtime-config
data:
  postfix-main.cf: |
{{ .Files.Get "config/postfix-main.cf" | indent 4 }}
  user-patches.sh: |
{{ .Files.Get "config/user-patches.sh" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: l8ai-mail
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: l8ai-mail
  template:
    metadata:
      labels:
        app.kubernetes.io/name: l8ai-mail
    spec:
      nodeSelector:
        kubernetes.io/hostname: "192.168.0.24"
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: prepare-mail-config
          image: docker.io/mailserver/docker-mailserver@sha256:af51b15dd3fc72153c0e90eb7692bb5e3a463212d87959a80fa7aa89b617d44a
          command:
            - /bin/bash
            - -ec
            - |
              test -s /accounts/postfix-accounts.cf
              install -m 0600 /accounts/postfix-accounts.cf /config/postfix-accounts.cf
              test -s /config/opendkim/keys/l8ai.cn/mail.private
              test -s /mail-tls/tls.crt
              test -s /mail-tls/tls.key
              install -m 0644 /runtime-config/postfix-main.cf /config/postfix-main.cf
              install -m 0755 /runtime-config/user-patches.sh /config/user-patches.sh
          volumeMounts:
            - name: accounts
              mountPath: /accounts
              readOnly: true
            - name: mail-config
              mountPath: /config
            - name: mail-tls
              mountPath: /mail-tls
              readOnly: true
            - name: runtime-config
              mountPath: /runtime-config
              readOnly: true
      containers:
        - name: mailserver
          image: docker.io/mailserver/docker-mailserver@sha256:af51b15dd3fc72153c0e90eb7692bb5e3a463212d87959a80fa7aa89b617d44a
          imagePullPolicy: IfNotPresent
          ports:
            - name: smtp
              containerPort: 25
            - name: submission
              containerPort: 587
            - name: smtps
              containerPort: 465
            - name: imaps
              containerPort: 993
            - name: relay
              containerPort: 2525
          env:
            - name: OVERRIDE_HOSTNAME
              value: mail.l8ai.cn
            - name: POSTMASTER_ADDRESS
              value: postmaster@l8ai.cn
            - name: SSL_TYPE
              value: manual
            - name: SSL_CERT_PATH
              value: /mail-tls/tls.crt
            - name: SSL_KEY_PATH
              value: /mail-tls/tls.key
            - name: PERMIT_DOCKER
              value: none
            - name: NETWORK_INTERFACE
              value: eth0
            - name: ONE_DIR
              value: "1"
            - name: ENABLE_CLAMAV
              value: "0"
            - name: ENABLE_AMAVIS
              value: "0"
            - name: ENABLE_SPAMASSASSIN
              value: "0"
            - name: ENABLE_RSPAMD
              value: "0"
            - name: ENABLE_FAIL2BAN
              value: "0"
            - name: ENABLE_POSTGREY
              value: "0"
            - name: ENABLE_OPENDKIM
              value: "1"
            - name: ENABLE_OPENDMARC
              value: "0"
            - name: SPOOF_PROTECTION
              value: "1"
            - name: POSTFIX_INET_PROTOCOLS
              value: ipv4
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: mail-data
              mountPath: /var/mail
            - name: mail-state
              mountPath: /var/mail-state
            - name: mail-config
              mountPath: /tmp/docker-mailserver
            - name: mail-tls
              mountPath: /mail-tls
              readOnly: true
          startupProbe:
            tcpSocket:
              port: smtp
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: imaps
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: smtp
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - name: accounts
          secret:
            secretName: l8ai-mail-accounts
            defaultMode: 0400
        - name: mail-data
          persistentVolumeClaim:
            claimName: l8ai-mail-data
        - name: mail-state
          persistentVolumeClaim:
            claimName: l8ai-mail-state
        - name: mail-config
          persistentVolumeClaim:
            claimName: l8ai-mail-config
        - name: mail-tls
          secret:
            secretName: l8ai-wildcard-tls
            defaultMode: 0400
        - name: runtime-config
          configMap:
            name: l8ai-mail-runtime-config
            defaultMode: 0444
