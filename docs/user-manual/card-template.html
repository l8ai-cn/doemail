<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html,
  body {
    margin: 0;
    padding: 0;
    width: 980px;
    height: 572px;
    overflow: hidden;
    background: #ffffff;
    font-family: "PingFang SC", "Helvetica Neue", "Hiragino Sans GB", Helvetica, Arial, sans-serif;
  }

  .card {
    box-sizing: border-box;
    width: 980px;
    height: 572px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
  }

  .head {
    background: #0f6ff5;
    color: #ffffff;
    border-radius: 18px 18px 0 0;
    padding: 16px 24px 14px;
  }

  .head-title {
    font-size: 30px;
    font-weight: 700;
    line-height: 1.2;
  }

  .head-sub {
    font-size: 16px;
    opacity: 0.92;
    margin-top: 6px;
  }

  .rows {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 12px;
    border: 1px solid #e6e9ee;
    border-top: none;
    border-radius: 0 0 18px 18px;
    background: #ffffff;
  }

  .row {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    border: 1px solid #e9ecf1;
    border-radius: 12px;
    padding: 4px 16px;
    min-height: 0;
  }

  .left {
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
  }

  .label {
    font-size: 13px;
    color: #6b7280;
    line-height: 1.2;
  }

  .value {
    font-size: 20px;
    font-weight: 600;
    color: #111111;
    line-height: 1.3;
  }

  .hint {
    font-size: 13px;
    color: #1673f5;
    text-align: right;
    line-height: 1.35;
    max-width: 46%;
    flex: none;
  }
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <div class="head-title">__TITLE__</div>
    <div class="head-sub">__SUBTITLE__</div>
  </div>
  <div class="rows">__ROWS__</div>
</div>
</body>
</html>
